<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<title>For My Bangaram 💖</title>

<style>
body{
 margin:0;
 font-family:'Poppins',sans-serif;
 background:linear-gradient(135deg,#ffdfe8,#fff5f8);
 text-align:center;
 color:#444;
 overflow-x:hidden;
}

h1,h2,h3{
 font-family:'Playfair Display',serif;
 color:#d46a84;
}

.page{
 display:none;
 min-height:100vh;
 justify-content:center;
 align-items:center;
 padding:20px 0;
}
.active{display:flex;}

.card{
 background:rgba(255,255,255,0.95);
 padding:25px;
 border-radius:25px;
 width:90%;
 max-width:360px;
 box-shadow:0 8px 25px rgba(255,182,193,0.35);
}

button{
 padding:12px 20px;
 border:none;
 border-radius:30px;
 background:#ffb6c9;
 color:white;
 margin:8px;
}

/* Hearts */
.heart{
 position:fixed;
 width:26px;height:26px;
 background:#ff6f91;
 bottom:-30px;
 transform:rotate(45deg);
 animation:floatUp 6s linear forwards;
}
.heart::before,.heart::after{
 content:'';
 position:absolute;
 width:26px;height:26px;
 background:#ff6f91;
 border-radius:50%;
}
.heart::before{top:-13px;}
.heart::after{left:-13px;}
@keyframes floatUp{
 from{bottom:-30px;}
 to{bottom:110vh;}
}

/* Popup */
.popup{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.4);
 display:none;
 justify-content:center;
 align-items:center;
 z-index:99;
}
.popupBox{
 background:white;
 padding:25px;
 border-radius:20px;
 width:80%;
 max-width:300px;
}

/* Kiss */
.kiss{
 position:fixed;
 font-size:28px;
 animation:kissFly 2s forwards;
}
@keyframes kissFly{
 from{opacity:1;}
 to{opacity:0; transform:translateY(-150px) scale(2);}
}
</style>
</head>

<body>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popupBox">
<p id="popText"></p>
<button onclick="closePop()">OK 💖</button>
</div>
</div>

<!-- SOUNDS -->
<audio id="clickS" src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b0c4f.mp3"></audio>
<audio id="winS" src="https://cdn.pixabay.com/audio/2022/03/26/audio_1c8e6e4a42.mp3"></audio>
<audio id="kissS" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a73467.mp3"></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="card">
<h3>Secret Page for you 😌💗</h3>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="unlock()">Open 💌</button>
</div></div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<div class="card">
<p id="type"></p>
<button onclick="show(3)">Next 😘</button>
</div></div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<div class="card">
<h3>Will you be my Valentine? 💖</h3>
<p>Try clicking No button 😜</p>
<button onclick="show(4)">Yes 💗</button>
<button onclick="jump()" id="noBtn">No 😝</button>
</div></div>

<!-- PAGE 4 QUIZ -->
<div class="page" id="p4">
<div class="card">
<h3>Love Quiz 💖</h3>
<p id="q"></p>
<div id="opts"></div>
</div></div>

<!-- PAGE 5 SCORE -->
<div class="page" id="p5">
<div class="card">
<h3>Your score 😍</h3>
<p id="finalScore"></p>
<button onclick="show(6)">Memories 📸</button>
</div></div>

<!-- PAGE 6 MEMORIES -->
<div class="page" id="p6">
<div class="card">
<h3>Our Memories 📸</h3>
<img id="photo" width="220" style="border-radius:20px;"><br>
<button onclick="show(7)">Next 💕</button>
</div></div>

<!-- PAGE 7 LETTER -->
<div class="page" id="p7">
<div class="card">
<p>
Nanna …🫶  
Ninnu kalavadam honestly na life lo best thing ani cheppachu...  
Always yours, Navya 💞
</p>
<button onclick="show(8)">Next 😘</button>
</div></div>

<!-- PAGE 8 -->
<div class="page" id="p8">
<div class="card">
<p>Waiting for your Valentine gift too 😜</p>
<button onclick="kissExplosion()">Kiss kavaalaa?💋</button>
<button onclick="show(9)">Final Surprise 💐</button>
</div></div>

<!-- PAGE 9 BOUQUET -->
<div class="page" id="p9">
<div class="card">
<h3>This bouquet is for you 💐</h3>
<button onclick="flowers()">Open Bouquet 💐</button>
<div id="bouquet" style="display:none;font-size:60px;">💐🌹🌸🌷🌺</div>
</div></div>

<script>

/* popup */
function pop(msg){
 popText.innerText=msg;
 popup.style.display="flex";
}
function closePop(){popup.style.display="none";}

/* sound */
function play(id){
 document.getElementById(id).currentTime=0;
 document.getElementById(id).play();
}

/* hearts */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.style.left=Math.random()*100+"vw";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},400);

/* nav */
function show(n){
 play("clickS");
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById("p"+n).classList.add("active");
}

/* Funny Password */
function unlock(){
 if(pass.value=="love") show(2);
 else pop("Wrong password 😜 Are you even my Lokesh?");
}

/* typing */
let msg="Dear Lokesh 💌 You made my days special.";
let i=0;
(function type(){
 if(i<msg.length){
  document.getElementById("type").innerHTML+=msg[i++];
  setTimeout(type,40);
 }
})();

/* Funny No button */
function jump(){
 pop("Ayyoo 😝 No clicking allowed! Say YES only 💖");
 let b=noBtn;
 b.style.position="absolute";
 b.style.left=Math.random()*200+"px";
 b.style.top=Math.random()*300+"px";
}

/* QUIZ */
let quiz=[
["When relationship started?","Jan5 2023","Jan5 2022","March 1","Jan5 2022"],
["Who loves more?","Me","You","Both","Me"]
];

let qi=0,score=0;

function loadQ(){
 let q=quiz[qi];
 qDiv.innerHTML=q[0];
 opts.innerHTML=
 `<button onclick="ans('${q[1]}')">${q[1]}</button>
  <button onclick="ans('${q[2]}')">${q[2]}</button>
  <button onclick="ans('${q[3]}')">${q[3]}</button>`;
}
var qDiv=document.getElementById("q");
loadQ();

function ans(a){
 if(a==quiz[qi][4]){
  score++; play("winS");
  pop("Correct 😍 Wahh memory strong!");
 } else pop("Wrong 😜 Love memory weak ah?");
 qi++;
 if(qi<quiz.length) loadQ();
 else{
  finalScore.innerHTML="Score: "+score+" 💖";
  show(5);
 }
}

/* slideshow */
let photos=[
"https://i.postimg.cc/Ghh6KT8Y/Snapchat-1471127375.jpg",
"https://i.postimg.cc/LsBVGvGH/Snapchat-1742409982.jpg",
"https://i.postimg.cc/4yKV412c/Screenshot-20251022-212455.jpg"
];
let pi=0;
setInterval(()=>{
 if(p6.classList.contains("active")){
  photo.src=photos[pi];
  pi=(pi+1)%photos.length;
 }
},2000);

/* kiss */
function kissExplosion(){
 play("kissS");
 for(let i=0;i<20;i++){
  let k=document.createElement("div");
  k.innerHTML="💋";
  k.className="kiss";
  k.style.left=Math.random()*100+"vw";
  k.style.top=Math.random()*100+"vh";
  document.body.appendChild(k);
  setTimeout(()=>k.remove(),2000);
 }
}

/* bouquet */
function flowers(){
 bouquet.style.display="block";
 play("winS");
 pop("Flowers for my favorite person 😘💐");
}

</script>

</body>
</html>
